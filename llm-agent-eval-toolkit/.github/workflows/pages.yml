name: Live demo

# Rebuilds the demo dashboard from the offline example on every push to main and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/support_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ../..
      - name: Baseline run
        run: agent-eval eval eval.yaml -o baseline.json -q --name "baseline (main branch)"
      - name: Simulated bad pull request
        run: AGENT_VARIANT=regressed agent-eval eval eval.yaml -o regressed.json -q --name "simulated bad pull request"
      - name: Gate report (expected to fail on the regression)
        run: agent-eval gate regressed.json --baseline baseline.json --thresholds thresholds.yaml --markdown gate.md || true
      - name: Build site
        run: |
          mkdir -p ../../site
          agent-eval dashboard --traces agent_eval.db --report baseline.json --report regressed.json \
            -o ../../site/index.html --title "Evaluation & Observability Toolkit for LLM Agents: live demo"
          cp baseline.json regressed.json gate.md ../../site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
